name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Prepare FFmpeg
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip'
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Invoke-WebRequest "$url.sha256" -OutFile ffmpeg.sha256
          $expected = ((Get-Content ffmpeg.sha256 -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash -ne $expected) { throw 'FFmpeg checksum mismatch' }
          Expand-Archive ffmpeg.zip -DestinationPath .ffmpeg
          $bin = (Get-ChildItem .ffmpeg -Recurse -Filter ffmpeg.exe).Directory.FullName
          $bin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and verify
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
      - name: Publish tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" release/*.zip release/SHA256SUMS.txt --title "网络ASR ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md --verify-tag
